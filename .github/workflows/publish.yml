name: Generate and Publish Academic Website

on:
  push:
    branches:
      - main
    paths:
      - "own-bib.bib"
      - "generate.py"
      - "style.css"
      - "script.js"
      - "*.html"
      - "requirements.txt"
      - ".github/workflows/publish.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show current commit
        run: |
          echo "Commit:"
          git rev-parse HEAD
          echo "Branch:"
          git branch --show-current

      - name: Check BibTeX file
        run: |
          echo "BibTeX file:"
          ls -lh own-bib.bib
          echo "Number of entries:"
          grep -c '^@' own-bib.bib || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate publications page
        run: |
          python generate.py

      - name: Verify generated publications
        run: |
          test -f publications.html
          echo "Generated publications.html:"
          ls -lh publications.html
          echo "Publication count in generated page:"
          grep -o '<article class="publication"' publications.html | wc -l

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
